name: CI

on:
  push:
  pull_request:

jobs:
  validate-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate frontend build
        run: ./scripts/validate_frontend.sh

  docs:
    needs: validate-frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v2
      - name: Create virtual environment
        run: uv venv
      - name: Install dependencies
        run: uv pip install -e ".[dev,docs]"
      - name: MkDocs build (strict)
        run: .venv/bin/mkdocs build --strict
      - name: Check public markdown links
        run: .venv/bin/python scripts/check_md_links.py

  test:
    needs: [validate-frontend, docs]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@v2
      - name: Create virtual environment
        run: uv venv
      - name: Install dependencies
        run: uv pip install -e .[dev]
      - name: Ruff
        run: .venv/bin/ruff check .
      - name: Mypy
        run: .venv/bin/mypy
      - name: Pytest with coverage
        run: |
          .venv/bin/pytest --cov=penguiflow --cov-report=term --cov-report=xml --cov-fail-under=84.5
      - name: Upload coverage reports
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

  mlflow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v2
      - name: Create virtual environment
        run: uv venv
      - name: Install tracing dependencies
        run: uv pip install -e ".[dev,mlflow]" "mlflow==3.18.0" "litellm==1.108.0"
      - name: Test real MLflow and LiteLLM SDKs
        run: >-
          .venv/bin/pytest tests/test_mlflow_telemetry.py
          tests/test_mlflow_tracing_integration.py tests/test_llm_tracing.py
          tests/test_mlflow_sink_resilience.py tests/test_background_trace_context.py
          tests/test_mlflow_http_e2e.py tests/test_mlflow_lifecycle_e2e.py
          tests/test_mlflow_background_e2e.py

  publish:
    needs: [test, mlflow]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v2
      - name: Build package
        run: uv build
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
