[build-system]
requires = ["uv_build>=0.13.4,<0.14"]
build-backend = "uv_build"

[project]
name = "penguiflow-lite"
version = "6.1.0"
description = "Async-first orchestration library for multi-agent and data pipelines"
requires-python = ">=3.11"
license = "MIT"
authors = [
    {name = "PenguiFlow Team"},
]
dependencies = [
    "pydantic>=2.6",
    "click>=8.1",
    "pyyaml>=6.0",
    "fastapi>=0.118",
    "databricks-mcp>=0.6.0",
    "mcp>=1.26,<2",
    "typing-extensions>=4.15",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.8",
    "pytest>=7.4",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.0",
    "coverage[toml]>=7.0",
    "hypothesis>=6.103",
    "ruff>=0.2",
    "jsonschema>=4.23",
    "fastapi>=0.118",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "tenacity>=9.0.0",
    "aiohttp>=3.9.0",
    "markitdown>=0.1.5",
    "grpcio>=1.70.0",
    "grpcio-status>=1.70.0",
    "grpcio-tools>=1.70.0",
    "googleapis-common-protos>=1.66.0",
    "protobuf>=5.26.0",
    # LLM provider SDKs for testing native LLM layer
    "openai>=2.0.0",
    "anthropic>=0.75.0",
    "google-genai>=1.57.0",
    "boto3>=1.42.0",
    # pydantic-ai transport tests
    "pydantic-ai-slim[openai,openrouter]>=1.107.0,<2",
    "genai-prices>=0.0.66,<1",
]
a2a-server = [
    "fastapi>=0.118",
]
a2a-grpc = [
    "grpcio>=1.70.0",
    "grpcio-status>=1.70.0",
    "grpcio-tools>=1.70.0",
    "googleapis-common-protos>=1.66.0",
    "protobuf>=5.26.0",
    # LLM provider SDKs for native LLM layer tests
    "openai>=2.0.0",
    "anthropic>=0.75.0",
    "google-genai>=1.57.0",
    "boto3>=1.42.0",
]
a2a-client = [
    "httpx>=0.27",
]
planner = [
    "litellm>=1.94.0",
    "dspy>=3.0.3",
    "fastmcp>=3.0",
    "utcp>=1.1.0",
    "utcp-http>=1.0.0",
    "tenacity>=9.0.0",
    "aiohttp>=3.9.0",
    "jsonschema>=4.23",
]
web = [
    "aiohttp>=3.9.0",
    "markitdown>=0.1.5",
]
llm = [
    "openai>=2.0.0",
    "anthropic>=0.75.0",
    "google-genai>=1.57.0",
    "boto3>=1.42.0",
    "databricks-sdk>=0.77.0",
]
tools-cli = ["utcp-cli>=1.0.0"]
tools-websocket = ["utcp-websocket>=1.0.0"]
pricing = ["genai-prices>=0.0.66,<1"]
pydantic-ai = [
    "pydantic-ai-slim[openai,openrouter]>=1.107.0,<2",
    "genai-prices>=0.0.66,<1",
]

[project.scripts]
penguiflow-admin = "penguiflow.admin:main"
penguiflow = "penguiflow.cli.main:app"


[tool.uv.build-backend]
module-name = ["penguiflow", "penguiflow_a2a", "examples"]
module-root = ""
source-exclude = [
    ".DS_Store",
]

[tool.uv]
package = true
managed = true
default-groups = ["dev"]

[dependency-groups]
dev = [
    "mypy>=1.8",
    "pytest>=7.4",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.0",
    "coverage[toml]>=7.0",
    "hypothesis>=6.103",
    "ruff>=0.2",
    "jsonschema>=4.23",
    "fastapi>=0.118",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "tenacity>=9.0.0",
    "aiohttp>=3.9.0",
    "markitdown>=0.1.5",
    "grpcio>=1.70.0",
    "grpcio-status>=1.70.0",
    "grpcio-tools>=1.70.0",
    "googleapis-common-protos>=1.66.0",
    "protobuf>=5.26.0",
    # LLM provider SDKs for native LLM layer tests
    "openai>=2.0.0",
    "anthropic>=0.75.0",
    "google-genai>=1.57.0",
    "boto3>=1.42.0",
    # pydantic-ai transport tests
    "pydantic-ai-slim[openai,openrouter]>=1.107.0,<2",
    "genai-prices>=0.0.66,<1",
    "mypy-protobuf>=5.1.0",
    "types-grpcio>=1.85.0.20261028",
    "types-pyyaml>=6.0.12.20261113",
]

[tool.ruff]
target-version = "py311"
line-length = 79
src = [".", "tests"]
# Generated protobuf/gRPC modules and their stubs.
extend-exclude = [
    "penguiflow_a2a/grpc/a2a_pb2*.py",
    "penguiflow_a2a/grpc/a2a_pb2*.pyi",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "D", "W", "N", "C4", "SIM", "RUF", "ANN", "TC", "A", "ARG", "RET", "PTH", "DTZ", "ASYNC", "TRY", "EM", "SLF", "T20", "ERA", "INP", "C90"]
ignore = []

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pydocstyle]
convention = "google"

# Public exception names kept as they are for API stability.
[tool.ruff.lint.pep8-naming]
ignore-names = [
    "ModelRetry",
    "ValidationRetry",
    "MemoryBudgetExceeded",
    "RemoteTaskInputRequired",
    "RemoteTaskAuthRequired",
    "SteeringCancelled",
]

# Pydantic evaluates annotations at runtime, so their imports stay at runtime.
[tool.ruff.lint.flake8-type-checking]
runtime-evaluated-base-classes = ["pydantic.BaseModel"]

[tool.mypy]
python_version = "3.11"
files = ["penguiflow", "penguiflow_a2a", "examples", "tests"]
strict = true
pretty = true
show_error_codes = true
warn_redundant_casts = true
warn_unreachable = true
warn_unused_ignores = true
no_implicit_optional = true
disallow_untyped_defs = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]
mypy_path = ["."]
explicit_package_bases = true
# Generated protobuf modules; mypy reads their .pyi stubs instead.
exclude = ['penguiflow_a2a/grpc/a2a_pb2(_grpc)?\.py$']

# numpy is a transitive-only dependency. Newer numpy releases ship .pyi stubs
# that use PEP 695 `type` statements, which mypy rejects under our 3.11 target
# (`requires-python >= 3.11`). We never import numpy directly, so skip following
# imports into it rather than dropping 3.11 type-checking of our own code.
[[tool.mypy.overrides]]
module = "numpy.*"
follow_imports = "skip"
follow_imports_for_stubs = true

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.coverage.run]
source = ["penguiflow"]
omit = [
    "*/tests/*",
    "*/__pycache__/*",
    "*/.venv/*",
    "*/planner/dspy_client.py",
    "*/cli/*",
]

[tool.coverage.report]
fail_under = 84.5
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "def __repr__",
    "def __str__",
]
precision = 1
show_missing = true
skip_covered = false
